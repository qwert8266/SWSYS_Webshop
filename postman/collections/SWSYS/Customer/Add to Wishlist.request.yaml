$kind: http-request
name: Add to Wishlist
url: "{{baseUrl}}/user/me/wishlist/{{productId}}"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 2xx", function () {
          pm.expect(pm.response.code).to.be.within(200, 299);
      });
      pm.test("Response time is less than 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
      pm.test("Response body is valid JSON object", function () {
          pm.expect(pm.response.json()).to.be.an("object");
      });
      pm.test("Response body contains 'active' field", function () {
          pm.expect(pm.response.json()).to.have.property("active");
          });
      pm.test("Response body has active set to true", function() {
          pm.expect(pm.response.json().active).to.be.true;
      });
    language: text/javascript
order: 10000
